<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ – Taskra</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .contact-page {
      max-width: 600px;
      margin: 0 auto;
      padding: 80px 24px;
    }
    .contact-form {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: white;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 140px;
    }
    .required {
      color: #ef4444;
      margin-left: 4px;
    }
    .submit-btn {
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .submit-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .form-note {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">
      <img src="icon.png" class="logo-img" alt="Taskra">
      Taskra
    </a>
  </div>
</header>

<main class="contact-page">
  <div class="section-label">Contact</div>
  <h1 style="font-size:32px;font-weight:800;margin-bottom:8px;">お問い合わせ</h1>
  <p style="color:var(--text-muted);font-size:15px;line-height:1.7;">
    ご質問・ご要望・不具合のご報告などお気軽にどうぞ。<br>
    通常3営業日以内にご返答いたします。
  </p>

  <form class="contact-form" action="https://formspree.io/f/xpqbkdea" method="POST">
    <div class="form-group">
      <label>お名前<span class="required">*</span></label>
      <input type="text" name="name" placeholder="山田 太郎" required>
    </div>

    <div class="form-group">
      <label>メールアドレス<span class="required">*</span></label>
      <input type="email" name="email" placeholder="example@email.com" required>
    </div>

    <div class="form-group">
      <label>お問い合わせ種別</label>
      <select name="category">
        <option value="">選択してください</option>
        <option value="機能について">機能について</option>
        <option value="料金・お支払いについて">料金・お支払いについて</option>
        <option value="不具合の報告">不具合の報告</option>
        <option value="アカウントについて">アカウントについて</option>
        <option value="その他">その他</option>
      </select>
    </div>

    <div class="form-group">
      <label>お問い合わせ内容<span class="required">*</span></label>
      <textarea name="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
    </div>

    <p class="form-note">
      送信いただいた個人情報は、お問い合わせへの返答にのみ使用します。<br>
      <a href="privacy.html" style="color:var(--primary);">プライバシーポリシー</a>をご確認ください。
    </p>

    <button type="submit" class="submit-btn">送信する</button>
  </form>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <p>© 2025 Taskra. All rights reserved.</p>
      <div class="footer-bottom-links">
        <a href="terms.html">利用規約</a>
        <a href="privacy.html">プライバシーポリシー</a>
        <a href="tokushoho.html">特定商取引法</a>
      </div>
    </div>
  </div>
</footer>

</body>
</html>
